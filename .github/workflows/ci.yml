name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - run: bun run test
      - run: bun run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUIRE_DB_TESTS: "1"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/samrian_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/samrian_test
      TEST_APP_DATABASE_URL: postgres://samrian_app_runtime:samrian-app-local@localhost:5432/samrian_test
      TEST_AUTH_DATABASE_URL: postgres://samrian_auth_runtime:samrian-auth-local@localhost:5432/samrian_test
      TEST_WORKER_DATABASE_URL: postgres://samrian_worker_runtime:samrian-worker-local@localhost:5432/samrian_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: docker compose -f docker-compose.db.yml up -d --wait
      - run: docker compose -f docker-compose.worker.yml up -d --wait redis
      - run: bunx drizzle-kit migrate
      - run: bun run test --project db --project repos --project queue
