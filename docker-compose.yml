x-app-build: &app-build
  context: .
  target: runner
  args:
    NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    NEXT_PUBLIC_SOURCE_URL: ${NEXT_PUBLIC_SOURCE_URL:-}
    NEXT_PUBLIC_AUTH_PROVIDER: ${NEXT_PUBLIC_AUTH_PROVIDER:-better-auth}
    NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-false}

services:
  migrate:
    build: *app-build
    container_name: samrian-migrate
    command: bun run db:migrate
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/samrian
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: *app-build
    container_name: samrian-app
    command: bun run start
    env_file:
      - path: .env
        required: false
    environment:
      AUTH_DATABASE_URL: postgres://samrian_auth_runtime:${SAMRIAN_AUTH_DB_PASSWORD:-samrian-auth-local}@postgres:5432/samrian
      APP_DATABASE_URL: postgres://samrian_app_runtime:${SAMRIAN_APP_DB_PASSWORD:-samrian-app-local}@postgres:5432/samrian
      REDIS_URL: redis://redis:6379
      JOB_PROVIDER: bullmq
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "fetch(''http://localhost:3000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    build: *app-build
    container_name: samrian-worker
    command: bun run worker
    env_file:
      - path: .env
        required: false
    environment:
      WORKER_DATABASE_URL: postgres://samrian_worker_runtime:${SAMRIAN_WORKER_DB_PASSWORD:-samrian-worker-local}@postgres:5432/samrian
      REDIS_URL: redis://redis:6379
      JOB_PROVIDER: bullmq
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: samrian-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: samrian
      SAMRIAN_APP_DB_PASSWORD: ${SAMRIAN_APP_DB_PASSWORD:-samrian-app-local}
      SAMRIAN_AUTH_DB_PASSWORD: ${SAMRIAN_AUTH_DB_PASSWORD:-samrian-auth-local}
      SAMRIAN_WORKER_DB_PASSWORD: ${SAMRIAN_WORKER_DB_PASSWORD:-samrian-worker-local}
    volumes:
      - samrian-postgres-data:/var/lib/postgresql/data
      - ./scripts/db/init-roles.sh:/docker-entrypoint-initdb.d/001-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d samrian"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: samrian-redis
    command: redis-server --appendonly yes
    volumes:
      - samrian-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  samrian-postgres-data:
  samrian-redis-data:
